<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zonas · Cali y Jamundí</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Un solo mapa para los dos tipos de zona: rojo (sin cobertura) y azul (precio
   mínimo), sobre los barrios oficiales. Panel a la izquierda, mapa a la derecha.
   Herramienta de computador. */
:root {
  /* La paleta del portal (globals.css). */
  --bg: #f7f7f7; --panel: #ffffff; --fg: #0d0b14; --muted: #57526b; --line: #e9e6f1; --map: #f1eff7;
  --red: #dc2626; --red-soft: #fdecec; --blue: #1d5fd1; --blue-soft: #e7effc; --barrio: #57526b; --km: #059669;
  --accent: #532ce1; --accent-fg: #ffffff; --accent-soft: #ede6ff;
  --font-body: "Sora", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.5 var(--font-body); }
.app { height: 100%; display: grid; grid-template-columns: minmax(300px, 360px) 1fr; }
aside { background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; min-width: 0; }
.head { padding: 14px 16px; border-bottom: 1px solid var(--line); display: grid; gap: 12px; }
.back { display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; border-radius: 12px; font-size: 15px; font-weight: 600; color: var(--accent-fg); background: var(--accent); text-decoration: none; }
.back:hover { filter: brightness(1.1); }
h1 { font-size: 18px; font-weight: 600; margin: 0; }
.scroll { overflow-y: auto; padding: 14px 16px 16px; display: grid; gap: 16px; align-content: start; }
.label { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; margin: 0 0 6px; display: block; }
button { font: inherit; font-weight: 500; border-radius: 8px; padding: 7px 12px; border: 1px solid var(--line); background: var(--panel); color: var(--fg); cursor: pointer; }
button:hover { border-color: var(--muted); }
button:focus-visible, input:focus-visible, textarea:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button:disabled { opacity: .5; cursor: default; }
button.primary { background: var(--fg); border-color: var(--fg); color: var(--bg); }
button.danger { color: var(--red); }
button[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.new { display: grid; gap: 8px; }
.new button { display: flex; align-items: center; gap: 10px; padding: 10px 12px; text-align: left; font-weight: 600; border-width: 1.5px; }
.new .red { border-color: var(--red); color: var(--red); background: var(--red-soft); }
.new .blue { border-color: var(--blue); color: var(--blue); background: var(--blue-soft); }
.new .red:hover, .new .red[aria-pressed="true"] { background: var(--red); color: #fff; }
.new .blue:hover, .new .blue[aria-pressed="true"] { background: var(--blue); color: #fff; }
.dot { width: 12px; height: 12px; border-radius: 3px; flex: none; border: 2px solid currentColor; }
.dot.red { color: var(--red); background: var(--red-soft); }
.dot.blue { color: var(--blue); background: var(--blue-soft); }
input, textarea { font: inherit; width: 100%; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; background: var(--bg); color: var(--fg); }
textarea { resize: vertical; min-height: 54px; }
.row { display: flex; gap: 8px; }
.row input { flex: 1; min-width: 0; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.check { display: flex; gap: 8px; align-items: center; font-size: 13px; }
.check input { width: 16px; height: 16px; accent-color: var(--blue); }
.card { display: grid; gap: 8px; border: 1.5px solid var(--line); border-radius: 10px; padding: 12px; }
.card.red { border-color: var(--red); }
.card.blue { border-color: var(--blue); }
.card p { margin: 0; }
.card .kind { font-weight: 600; display: flex; align-items: center; gap: 8px; }
.card.red .kind { color: var(--red); }
.card.blue .kind { color: var(--blue); }
.status { font-size: 12.5px; color: var(--muted); margin: 0; }
.status.err { color: var(--red); }
.results { list-style: none; margin: 4px 0 0; padding: 0; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); max-height: 220px; overflow-y: auto; }
.results li button { width: 100%; text-align: left; border: 0; border-radius: 0; background: transparent; padding: 7px 10px; display: flex; justify-content: space-between; gap: 8px; }
.results li button:hover { background: var(--bg); }
.results small { color: var(--muted); font-family: var(--font-mono); font-size: 11px; }
.verdict { display: grid; gap: 4px; border-radius: 10px; padding: 10px 12px; }
.verdict b { font-size: 15px; }
.verdict.sin_cobertura { background: var(--red-soft); color: var(--red); }
.verdict.minimo { background: var(--blue-soft); color: var(--blue); }
.verdict.km { background: #e6f5ef; color: var(--km); }
.verdict small { color: var(--muted); }
.mono { font-family: var(--font-mono); font-size: 11.5px; color: var(--muted); }
.zones { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.zone { display: flex; align-items: center; gap: 10px; border: 1px solid transparent; border-radius: 8px; padding: 7px 8px; cursor: pointer; }
.zone:hover { background: var(--bg); }
.zone[aria-current="true"] { border-color: var(--fg); background: var(--bg); }
.zone .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.zone .tag { font-family: var(--font-mono); font-size: 12px; white-space: nowrap; color: var(--muted); }
.zone.red .tag { color: var(--red); }
.zone.blue .tag { color: var(--blue); }
.empty { color: var(--muted); font-size: 13px; margin: 0; }
.mapwrap { position: relative; min-width: 0; min-height: 0; }
#map { position: absolute; inset: 0; background: var(--map); }
.modebar { position: absolute; top: 12px; left: 56px; right: 12px; z-index: 500; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; pointer-events: none; }
.modebar > * { pointer-events: auto; box-shadow: 0 1px 3px rgba(13, 11, 20, .12); }
.modebar .hint { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; font-size: 13px; }
.modebar .hint.red { border-color: var(--red); }
.modebar .hint.blue { border-color: var(--blue); }
.legend { position: absolute; right: 12px; bottom: 24px; z-index: 500; display: grid; gap: 4px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font-size: 12.5px; }
.legend span { display: flex; align-items: center; gap: 8px; }
.legend .barrio { display: inline-block; flex: none; width: 16px; height: 0; border-top: 2px dashed var(--barrio); }
.legend label { display: flex; align-items: center; gap: 8px; cursor: pointer; }
.legend input { margin: 0; width: 14px; height: 14px; }

/* Lo mínimo de Leaflet: su hoja de estilos no se puede cargar desde el CDN. */
.leaflet-pane, .leaflet-tile, .leaflet-marker-icon, .leaflet-marker-shadow, .leaflet-tile-container, .leaflet-pane > svg, .leaflet-pane > canvas, .leaflet-zoom-box, .leaflet-image-layer, .leaflet-layer { position: absolute; left: 0; top: 0; }
.leaflet-container { overflow: hidden; outline: 0; -webkit-tap-highlight-color: transparent; font-family: var(--font-body); }
.leaflet-container.leaflet-touch-zoom { touch-action: pan-x pan-y; }
.leaflet-container.leaflet-touch-drag { touch-action: none; }
.leaflet-pane { z-index: 400; } .leaflet-tile-pane { z-index: 200; } .leaflet-overlay-pane { z-index: 400; } .leaflet-marker-pane { z-index: 600; } .leaflet-tooltip-pane { z-index: 650; } .leaflet-popup-pane { z-index: 700; }
.leaflet-map-pane canvas { z-index: 100; } .leaflet-map-pane svg { z-index: 200; }
.leaflet-zoom-animated { transform-origin: 0 0; }
.leaflet-zoom-anim .leaflet-zoom-animated { transition: transform .25s cubic-bezier(0,0,.25,1); }
.leaflet-interactive { cursor: pointer; }
.leaflet-pane > svg path { pointer-events: none; }
.leaflet-pane > svg path.leaflet-interactive { pointer-events: visiblePainted; pointer-events: auto; }
.leaflet-grab { cursor: grab; } .leaflet-dragging .leaflet-grab { cursor: grabbing; }
.leaflet-crosshair, .leaflet-crosshair .leaflet-interactive { cursor: crosshair; }
.leaflet-marker-icon { display: block; }
.leaflet-tile { visibility: hidden; } .leaflet-tile-loaded { visibility: inherit; }
.leaflet-container img.leaflet-tile { max-width: none !important; max-height: none !important; user-select: none; }
.leaflet-control-attribution { margin: 0; padding: 0 5px; font-size: 11px; background: rgba(255,255,255,.8); color: #333; }
.leaflet-control-attribution a { color: #0b6bcb; }
.leaflet-control-container .leaflet-top, .leaflet-control-container .leaflet-bottom { position: absolute; z-index: 800; pointer-events: none; }
.leaflet-top { top: 0; } .leaflet-left { left: 0; } .leaflet-right { right: 0; } .leaflet-bottom { bottom: 0; }
.leaflet-control { position: relative; z-index: 800; pointer-events: auto; float: left; clear: both; margin: 12px 0 0 12px; }
.leaflet-bar { border: 1px solid var(--line); border-radius: 6px; background: var(--panel); overflow: hidden; }
.leaflet-bar a { display: block; width: 32px; height: 32px; line-height: 32px; text-align: center; text-decoration: none; color: var(--fg); font-size: 18px; font-weight: 600; }
.leaflet-bar a + a { border-top: 1px solid var(--line); }
.leaflet-tooltip { position: absolute; padding: 2px 6px; background: var(--panel); color: var(--fg); border: 1px solid var(--line); border-radius: 4px; white-space: nowrap; font-size: 12px; pointer-events: none; }
.vertex { width: 12px !important; height: 12px !important; margin: -6px 0 0 -6px !important; border-radius: 50%; background: var(--panel); border: 2px solid var(--edit); }
.mid { width: 9px !important; height: 9px !important; margin: -4.5px 0 0 -4.5px !important; border-radius: 50%; background: var(--edit); opacity: .45; cursor: copy; }
.mid:hover { opacity: 1; }
#map { --edit: var(--blue); }
#map.red { --edit: var(--red); }

@media (max-width: 760px) {
  .app { grid-template-columns: 1fr; grid-template-rows: 62vh auto; height: auto; }
  aside { order: 2; border-right: 0; border-top: 1px solid var(--line); }
  .mapwrap { order: 1; min-height: 62vh; }
}
@media (prefers-reduced-motion: reduce) { .leaflet-zoom-anim .leaflet-zoom-animated { transition: none; } }
</style>
</head>
<body>

<div class="app">
  <aside>
    <div class="head">
      <a class="back" href="/viajes">← Volver al portal</a>
      <h1>Zonas</h1>
    </div>
    <div class="scroll">
      <!-- Sin nada abierto: crear, probar y la lista. -->
      <section id="home" class="new">
        <button type="button" class="red" id="newRed" aria-pressed="false"><span class="dot red"></span>Nueva zona sin cobertura</button>
        <button type="button" class="blue" id="newBlue" aria-pressed="false"><span class="dot blue"></span>Nueva zona de precio mínimo</button>
      </section>

      <!-- Creando: un barrio por nombre, o a mano. -->
      <section id="pickBox" hidden>
        <div class="card" id="pickCard">
          <p class="kind" id="pickKind"></p>
          <input id="q" type="search" placeholder="Buscar un barrio" autocomplete="off" aria-label="Buscar un barrio">
          <ul class="results" id="results" hidden></ul>
          <div class="actions">
            <button type="button" id="drawBtn">Dibujar a mano</button>
            <button type="button" id="pickCancel">Cancelar</button>
          </div>
        </div>
      </section>

      <!-- Creando o editando una zona. -->
      <section id="formBox" hidden>
        <div class="card" id="formCard">
          <p class="kind" id="formKind"></p>
          <label class="label" for="zName">Nombre</label>
          <input id="zName" type="text" maxlength="120">
          <div id="noteBox">
            <label class="label" for="zNote">Nota</label>
            <textarea id="zNote" maxlength="500" placeholder="Opcional"></textarea>
          </div>
          <div id="minBox">
            <label class="label" for="zMin">Mínimo</label>
            <input id="zMin" type="text" inputmode="numeric" placeholder="$ 10.000">
            <label class="check" style="margin-top:6px"><input type="checkbox" id="zNoMin"> Sin mínimo (solo por km)</label>
          </div>
          <p class="status" id="editHint">Arrastra las esquinas para mover el borde.</p>
          <div class="actions">
            <button class="primary" id="saveBtn" type="button">Guardar</button>
            <button id="cancelBtn" type="button">Cancelar</button>
          </div>
          <div class="actions" id="delBox"></div>
          <p class="status" id="formStatus"></p>
        </div>
      </section>

      <section id="testBox">
        <label class="label" for="addr">Probar</label>
        <form class="row" id="testForm">
          <input id="addr" type="text" placeholder="Una dirección" autocomplete="off">
          <button type="submit" id="testAddrBtn">Probar</button>
        </form>
        <div id="resultBox" style="margin-top:8px" hidden></div>
      </section>

      <section id="listBox">
        <p class="label">Zonas (<span id="count">0</span>)</p>
        <ul class="zones" id="zones"></ul>
        <p class="status err" id="dbStatus" hidden></p>
      </section>
    </div>
  </aside>

  <div class="mapwrap">
    <div id="map" role="application" aria-label="Mapa de zonas de Cali y Jamundí"></div>
    <div class="modebar">
      <button id="testBtn" type="button" aria-pressed="false">Probar un punto</button>
      <button id="finishBtn" class="primary" type="button" hidden>Terminar</button>
      <button id="undoBtn" type="button" hidden>Deshacer punto</button>
      <button id="stopDrawBtn" type="button" hidden>Cancelar</button>
      <span class="hint" id="hint" hidden></span>
    </div>
    <div class="legend">
      <span><span class="dot red"></span>Sin cobertura</span>
      <span><span class="dot blue"></span>Precio mínimo</span>
      <label><input type="checkbox" id="showBarrios" checked><span class="barrio"></span>Barrios</label>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const css = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  const norm = (s) => s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
  const money = (n) => "$ " + Number(n).toLocaleString("es-CO");
  const el = (tag, props = {}, ...children) => { const e = Object.assign(document.createElement(tag), props); e.append(...children); return e; };

  // Los dos tipos de zona: dónde se guardan y cómo se ven.
  const TYPES = {
    red: { api: "/api/zonas", label: "Sin cobertura", newLabel: "Nueva zona sin cobertura", color: () => css("--red") },
    blue: { api: "/api/zonas-precio", label: "Precio mínimo", newLabel: "Nueva zona de precio mínimo", color: () => css("--blue") },
  };

  // ---------- Mapa ----------
  const AREA = L.latLngBounds([3.2, -76.63], [3.53, -76.42]);
  const map = L.map("map", { zoomControl: true, doubleClickZoom: false, minZoom: 12, maxZoom: 19, maxBounds: AREA.pad(0.05), maxBoundsViscosity: 1 })
    .setView([3.4372, -76.5225], 13);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19, bounds: AREA.pad(0.1), attribution: "© OpenStreetMap · Barrios: IDESC" }).addTo(map);
  // Capas de abajo hacia arriba: barrios, azules, rojas. Así la roja dentro de
  // una azul se ve y se puede tocar.
  for (const [name, z] of [["barrios", 350], ["blue", 410], ["red", 420]]) { map.createPane(name); map.getPane(name).style.zIndex = z; }
  const barrioCanvas = L.canvas({ padding: 0.3, pane: "barrios" });
  const svg = L.svg();
  const renderers = { red: L.svg({ pane: "red" }), blue: L.svg({ pane: "blue" }) };

  // La misma área que usa el bot para ordenar zonas (domain/price-zones.ts).
  function ringArea(ring) {
    const rad = Math.PI / 180, R = 6371000, k = Math.cos(ring[0][0] * rad);
    let twice = 0;
    for (let i = 0; i < ring.length; i++) {
      const a = ring[i], b = ring[(i + 1) % ring.length];
      twice += ((a[1] - ring[0][1]) * k * (b[0] - ring[0][0]) - (b[1] - ring[0][1]) * k * (a[0] - ring[0][0])) * rad * rad * R * R;
    }
    return Math.abs(twice) / 2;
  }

  // ---------- Estado ----------
  // idle · pick (eligiendo barrio o dibujo) · drawing · editing · testing
  let mode = "idle", newType = null;
  const hint = $("hint");
  function setHint(text, type) { hint.hidden = !text; hint.textContent = text || ""; hint.className = "hint" + (type ? " " + type : ""); }

  function resetAll() {
    if (mode === "drawing") stopDrawing();
    if (mode === "editing") closeForm();
    if (mode === "testing") stopTesting();
    closePick();
    mode = "idle"; setHint("");
  }

  // ---------- Barrios oficiales (IDESC) ----------
  let barrios = [];
  const barrioLayer = L.layerGroup();
  fetch("barrios.json").then((r) => r.json()).then((data) => {
    barrios = data.barrios.map((b) => ({ ...b, key: norm(b.nombre) }));
    for (const b of barrios) {
      L.polygon(b.borde, { renderer: barrioCanvas, color: css("--barrio"), weight: 1.2, opacity: 0.7, dashArray: "5 4", fillOpacity: 0 })
        .bindTooltip(b.nombre, { sticky: true })
        .addTo(barrioLayer);
    }
    syncBarrios();
  }).catch(() => showDbError("No se pudieron cargar los barrios. Recarga la página."));
  function syncBarrios() { $("showBarrios").checked ? barrioLayer.addTo(map) : barrioLayer.remove(); }
  $("showBarrios").onchange = syncBarrios;

  // ---------- Zonas guardadas ----------
  let zones = []; // { key, type, id, name, note?, minPrice?, barrioCode?, ring: [[lat,lng]], area }
  const zoneLayer = L.layerGroup().addTo(map);
  async function api(path, options = {}) {
    const res = await fetch(path, { ...options, headers: { "Content-Type": "application/json" }, cache: "no-store" });
    if (res.status === 401) { location.href = "/login?next=/zonas/mapa.html"; throw new Error("sesion"); }
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw Object.assign(new Error(data.error || "HTTP " + res.status), { shown: !!data.error });
    return data;
  }
  function showDbError(text) { $("dbStatus").hidden = !text; $("dbStatus").textContent = text || ""; }
  async function loadZones() {
    try {
      const [red, blue] = await Promise.all([api(TYPES.red.api), api(TYPES.blue.api)]);
      const pack = (type) => (z) => {
        const ring = z.ring.map((p) => [p.lat, p.lng]);
        return { ...z, type, key: type + ":" + z.id, ring, area: ringArea(ring) };
      };
      zones = [...red.map(pack("red")), ...blue.map(pack("blue"))].filter((z) => z.ring.length >= 3);
      renderZones(); showDbError("");
    } catch (e) {
      if (e.message !== "sesion") showDbError("No se pudieron leer las zonas. Se reintenta solo.");
    }
  }
  const tagOf = (z) => (z.type === "red" ? "Sin cobertura" : z.minPrice === null ? "Sin mínimo" : money(z.minPrice));

  function renderZones() {
    zoneLayer.clearLayers();
    // Dentro de cada tipo, las grandes primero: las pequeñas quedan encima.
    for (const z of [...zones].sort((a, b) => b.area - a.area)) {
      if (editKey === z.key) continue;
      const color = TYPES[z.type].color(), free = z.type === "blue" && z.minPrice === null;
      L.polygon(z.ring, { renderer: renderers[z.type], color, weight: 2, dashArray: free ? "6 5" : null, fillColor: color, fillOpacity: z.type === "red" ? 0.3 : free ? 0.06 : 0.16 })
        .bindTooltip(`${z.name} · ${tagOf(z)}`, { sticky: true })
        .on("click", (e) => { if (mode === "idle" || mode === "editing") { L.DomEvent.stop(e); editZone(z.key); } })
        .addTo(zoneLayer);
    }
    const list = $("zones"); list.textContent = "";
    $("count").textContent = zones.length;
    if (!zones.length) list.append(el("li", { className: "empty", textContent: "Todavía no hay zonas." }));
    const order = (a, b) => (a.type === b.type ? a.name.localeCompare(b.name, "es") : a.type === "red" ? -1 : 1);
    for (const z of [...zones].sort(order)) {
      const li = el("li", { className: "zone " + z.type, tabIndex: 0 },
        el("span", { className: "dot " + z.type }), el("span", { className: "name", textContent: z.name }), el("span", { className: "tag", textContent: tagOf(z) }));
      li.setAttribute("aria-current", editKey === z.key ? "true" : "false");
      li.onclick = () => editZone(z.key);
      li.onkeydown = (e) => { if (e.key === "Enter") editZone(z.key); };
      list.append(li);
    }
  }
  loadZones();
  setInterval(() => { if (!document.hidden && mode === "idle") loadZones(); }, 20000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden && mode === "idle") loadZones(); });

  // ---------- Nueva zona: un barrio o a mano ----------
  const results = $("results"), qIn = $("q");
  function startNew(type) {
    if (mode === "pick" && newType === type) { resetAll(); return; }
    resetAll();
    mode = "pick"; newType = type;
    $("newRed").setAttribute("aria-pressed", String(type === "red"));
    $("newBlue").setAttribute("aria-pressed", String(type === "blue"));
    $("pickBox").hidden = false;
    $("pickCard").className = "card " + type;
    $("pickKind").textContent = "";
    $("pickKind").append(el("span", { className: "dot " + type }), TYPES[type].newLabel);
    qIn.value = ""; results.hidden = true; qIn.focus();
    setHint("Busca un barrio o tócalo en el mapa", type);
  }
  function closePick() {
    $("pickBox").hidden = true;
    $("newRed").setAttribute("aria-pressed", "false"); $("newBlue").setAttribute("aria-pressed", "false");
  }
  $("newRed").onclick = () => startNew("red");
  $("newBlue").onclick = () => startNew("blue");
  $("pickCancel").onclick = resetAll;

  qIn.addEventListener("input", () => {
    const q = norm(qIn.value.trim()); results.textContent = "";
    if (!q) { results.hidden = true; return; }
    const hits = barrios.filter((b) => b.key.includes(q)).slice(0, 15);
    for (const b of hits) {
      const btn = el("button", { type: "button" }, el("span", { textContent: b.nombre }), el("small", { textContent: `comuna ${Number(b.comuna)}` }));
      btn.onclick = () => fromBarrio(b);
      results.append(el("li", {}, btn));
    }
    if (!hits.length) results.append(el("li", { className: "status", textContent: "Ningún barrio con ese nombre", style: "padding:7px 10px" }));
    results.hidden = false;
  });
  qIn.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); results.querySelector("button")?.click(); } });

  function fromBarrio(b) {
    const type = newType;
    closePick();
    openForm(type, null, b.borde.map((p) => [...p]), { name: b.nombre, barrioCode: b.codigo });
  }

  // ---------- Dibujar a mano ----------
  let draft = [], draftLine = null, draftMarkers = [];
  const finishBtn = $("finishBtn"), undoBtn = $("undoBtn"), stopDrawBtn = $("stopDrawBtn");
  function redrawDraft() {
    if (draftLine) draftLine.remove();
    draftMarkers.forEach((m) => m.remove()); draftMarkers = [];
    const color = TYPES[newType].color(), style = { renderer: svg, color, weight: 2, dashArray: "6 4", interactive: false };
    draftLine = draft.length >= 3 ? L.polygon(draft, { ...style, fillColor: color, fillOpacity: 0.15 }).addTo(map) : L.polyline(draft, style).addTo(map);
    draft.forEach((p, i) => {
      const m = L.marker(p, { draggable: true, icon: L.divIcon({ className: "vertex", iconSize: null }) }).addTo(map);
      m.on("drag", (e) => { draft[i] = [e.latlng.lat, e.latlng.lng]; draftLine.setLatLngs(draft); });
      draftMarkers.push(m);
    });
    finishBtn.disabled = draft.length < 3; undoBtn.disabled = !draft.length;
    setHint(draft.length < 3 ? "Toca cada esquina en el mapa" : "Terminar o doble clic", newType);
  }
  $("drawBtn").onclick = () => {
    closePick(); mode = "drawing"; draft = [];
    map.getContainer().classList.add("leaflet-crosshair", newType);
    finishBtn.hidden = false; undoBtn.hidden = false; stopDrawBtn.hidden = false; $("testBtn").hidden = true;
    redrawDraft();
  };
  function stopDrawing() {
    mode = "idle"; map.getContainer().classList.remove("leaflet-crosshair", "red", "blue");
    finishBtn.hidden = true; undoBtn.hidden = true; stopDrawBtn.hidden = true; $("testBtn").hidden = false; setHint("");
    if (draftLine) { draftLine.remove(); draftLine = null; }
    draftMarkers.forEach((m) => m.remove()); draftMarkers = [];
  }
  function finishDrawing() {
    if (draft.length < 3) return;
    const ring = draft.map((p) => [...p]), type = newType;
    stopDrawing();
    openForm(type, null, ring, { name: "", barrioCode: null });
  }
  undoBtn.onclick = () => { draft.pop(); redrawDraft(); };
  finishBtn.onclick = finishDrawing;
  stopDrawBtn.onclick = resetAll;
  map.on("dblclick", () => { if (mode === "drawing") finishDrawing(); });

  // ---------- Editar el borde: arrastrar, agregar y quitar esquinas ----------
  let editType = null, editKey = null, editId = null, editRing = null, editBarrio = null, editShape = null, handles = [];
  function clearHandles() { handles.forEach((m) => m.remove()); handles = []; }
  function drawEditable() {
    const color = TYPES[editType].color();
    if (editShape) editShape.setLatLngs(editRing);
    else editShape = L.polygon(editRing, { renderer: svg, color, weight: 2.5, dashArray: "6 4", fillColor: color, fillOpacity: 0.15, interactive: false }).addTo(map);
    clearHandles();
    editRing.forEach((p, i) => {
      const m = L.marker(p, { draggable: true, icon: L.divIcon({ className: "vertex", iconSize: null }), title: "Arrastra para mover · clic derecho para quitar" }).addTo(map);
      m.on("drag", (e) => { editRing[i] = [e.latlng.lat, e.latlng.lng]; editShape.setLatLngs(editRing); });
      m.on("dragend", drawEditable);
      m.on("contextmenu", (e) => {
        L.DomEvent.preventDefault(e.originalEvent);
        if (editRing.length > 3) { editRing.splice(i, 1); drawEditable(); }
      });
      handles.push(m);
    });
    editRing.forEach((a, i) => {
      const b = editRing[(i + 1) % editRing.length];
      const m = L.marker([(a[0] + b[0]) / 2, (a[1] + b[1]) / 2], { icon: L.divIcon({ className: "mid", iconSize: null }), title: "Toca para agregar una esquina" }).addTo(map);
      m.on("click", () => { editRing.splice(i + 1, 0, [m.getLatLng().lat, m.getLatLng().lng]); drawEditable(); });
      handles.push(m);
    });
    const many = editRing.length > 500;
    $("editHint").textContent = many ? `${editRing.length} esquinas: el máximo es 500, quita algunas (clic derecho).` : "Arrastra las esquinas para mover el borde.";
    $("editHint").className = "status" + (many ? " err" : "");
  }

  // ---------- Formulario ----------
  function openForm(type, zone, ring, preset) {
    if (mode === "testing") stopTesting();
    mode = "editing"; setHint("");
    editType = type; editKey = zone ? zone.key : null; editId = zone ? zone.id : null;
    editRing = ring; editBarrio = zone ? zone.barrioCode ?? null : preset.barrioCode;
    map.getContainer().classList.toggle("red", type === "red");
    $("home").hidden = true; $("listBox").hidden = true; $("testBox").hidden = true;
    $("formBox").hidden = false;
    $("formCard").className = "card " + type;
    $("formKind").textContent = "";
    $("formKind").append(el("span", { className: "dot " + type }), TYPES[type].label);
    $("zName").value = zone ? zone.name : preset.name;
    $("noteBox").hidden = type !== "red"; $("minBox").hidden = type !== "blue";
    $("zNote").value = zone && zone.note ? zone.note : "";
    const noMin = !!zone && zone.minPrice === null;
    $("zNoMin").checked = noMin; $("zMin").disabled = noMin;
    $("zMin").value = zone && zone.minPrice != null ? zone.minPrice.toLocaleString("es-CO") : "";
    $("formStatus").textContent = ""; $("formStatus").className = "status";
    resetDelete();
    if (editShape) { editShape.remove(); editShape = null; }
    drawEditable(); renderZones();
    map.fitBounds(L.latLngBounds(editRing).pad(0.3));
    (type === "blue" && (zone || preset.name) ? $("zMin") : $("zName")).focus();
  }
  function closeForm() {
    $("formBox").hidden = true; $("home").hidden = false; $("listBox").hidden = false; $("testBox").hidden = false;
    mode = "idle"; editType = null; editKey = null; editId = null; editRing = null; editBarrio = null;
    map.getContainer().classList.remove("red");
    if (editShape) { editShape.remove(); editShape = null; }
    clearHandles(); renderZones();
  }
  function editZone(key) {
    const z = zones.find((x) => x.key === key); if (!z) return;
    resetAll();
    openForm(z.type, z, z.ring.map((p) => [...p]));
  }
  $("cancelBtn").onclick = resetAll;
  $("zNoMin").onchange = () => { $("zMin").disabled = $("zNoMin").checked; if ($("zNoMin").checked) $("zMin").value = ""; };
  $("zMin").addEventListener("input", () => {
    const digits = $("zMin").value.replace(/\D/g, "");
    $("zMin").value = digits ? Number(digits).toLocaleString("es-CO") : "";
  });

  $("saveBtn").onclick = async () => {
    const st = $("formStatus"), name = $("zName").value.trim();
    const fail = (text, focus) => { st.textContent = text; st.className = "status err"; if (focus) focus.focus(); };
    if (!name) return fail("Falta el nombre.", $("zName"));
    if (editRing.length > 500) return fail("Máximo 500 esquinas.");
    const ring = editRing.map(([lat, lng]) => ({ lat: +lat.toFixed(6), lng: +lng.toFixed(6) }));
    let body;
    if (editType === "red") body = { name, note: $("zNote").value.trim(), ring };
    else {
      let minPrice = null;
      if (!$("zNoMin").checked) {
        const digits = $("zMin").value.replace(/\D/g, "");
        if (!digits || Number(digits) <= 0) return fail("Falta el mínimo.", $("zMin"));
        minPrice = Number(digits);
      }
      body = { name, minPrice, barrioCode: editBarrio, ring };
    }
    const base = TYPES[editType].api;
    $("saveBtn").disabled = true; st.className = "status"; st.textContent = "Guardando…";
    try {
      if (editId) await api(base + "/" + editId, { method: "PUT", body: JSON.stringify(body) });
      else await api(base, { method: "POST", body: JSON.stringify(body) });
      closeForm(); await loadZones();
    } catch (e) {
      if (e.message !== "sesion") fail(e.shown ? e.message : "No se pudo guardar. Intenta de nuevo.");
    } finally { $("saveBtn").disabled = false; }
  };

  function resetDelete() {
    const box = $("delBox"); box.textContent = "";
    if (editId) box.append(el("button", { type: "button", className: "danger", textContent: "Eliminar zona", onclick: askDelete }));
  }
  function askDelete() {
    const box = $("delBox"); box.textContent = "";
    const yes = el("button", { type: "button", className: "danger", textContent: "Sí, eliminar" });
    const no = el("button", { type: "button", textContent: "No", onclick: resetDelete });
    yes.onclick = async () => {
      try { await api(TYPES[editType].api + "/" + editId, { method: "DELETE" }); closeForm(); await loadZones(); }
      catch (e) { if (e.message !== "sesion") { $("formStatus").textContent = "No se pudo eliminar."; $("formStatus").className = "status err"; } }
    };
    box.append(el("span", { textContent: "¿Eliminar?" }), yes, no);
  }

  // ---------- Probar una dirección o un punto ----------
  const testBtn = $("testBtn");
  let testMarker = null;
  function stopTesting() { mode = "idle"; testBtn.setAttribute("aria-pressed", "false"); map.getContainer().classList.remove("leaflet-crosshair"); setHint(""); }
  testBtn.onclick = () => {
    if (mode === "testing") { stopTesting(); return; }
    resetAll();
    mode = "testing"; testBtn.setAttribute("aria-pressed", "true"); map.getContainer().classList.add("leaflet-crosshair");
    setHint("Toca donde sería la entrega");
  };
  map.on("click", (e) => {
    if (mode === "drawing") { draft.push([e.latlng.lat, e.latlng.lng]); redrawDraft(); }
    else if (mode === "testing") probe({ lat: e.latlng.lat, lng: e.latlng.lng }, null);
    else if (mode === "pick") { const b = barrioAt([e.latlng.lat, e.latlng.lng]); if (b) fromBarrio(b); }
  });
  // El barrio bajo un clic, aunque haya una zona encima (la zona tapa el clic).
  function inside(p, ring) {
    let c = false;
    for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
      const [yi, xi] = ring[i], [yj, xj] = ring[j];
      if ((yi > p[0]) !== (yj > p[0]) && p[1] < ((xj - xi) * (p[0] - yi)) / (yj - yi) + xi) c = !c;
    }
    return c;
  }
  function barrioAt(p) {
    return barrios.filter((b) => inside(p, b.borde)).sort((a, b) => ringArea(a.borde) - ringArea(b.borde))[0] || null;
  }
  $("testForm").onsubmit = (e) => {
    e.preventDefault();
    const address = $("addr").value.trim();
    if (!address) { $("addr").focus(); return; }
    probe({ address }, address);
  };

  async function probe(body, address) {
    const box = $("resultBox"); box.hidden = false; box.textContent = "";
    box.append(el("p", { className: "status", textContent: address ? "Ubicando la dirección…" : "Revisando…" }));
    $("testAddrBtn").disabled = true;
    try { showResult(await api("/api/zonas/probar", { method: "POST", body: JSON.stringify(body) }), address); }
    catch (e) {
      if (e.message === "sesion") return;
      box.textContent = "";
      box.append(el("p", { className: "status err", textContent: e.shown ? e.message : "No se pudo probar." }));
    } finally { $("testAddrBtn").disabled = false; }
  }

  function showResult(r, address) {
    const box = $("resultBox"); box.textContent = "";
    if (testMarker) testMarker.remove();
    testMarker = L.circleMarker([r.point.lat, r.point.lng], { renderer: svg, radius: 8, color: css("--panel"), weight: 3, fillColor: css("--fg"), fillOpacity: 1, interactive: false }).addTo(map);
    if (address) map.setView([r.point.lat, r.point.lng], Math.max(map.getZoom(), 16));
    const price = r.priceZones[0];
    let title, detail = "";
    if (r.kind === "sin_cobertura") {
      title = "Sin cobertura";
      detail = r.zone.name + (price && price.minPrice !== null ? ` · gana sobre «${price.name}»` : "");
    } else if (r.kind === "minimo") {
      title = "Mínimo " + money(price.minPrice);
      detail = price.name + " · si por km da más, se cobra por km";
    } else {
      title = "Solo por km";
      detail = price ? `${price.name} · sin mínimo` : "Fuera de toda zona";
    }
    const v = el("div", { className: "verdict " + r.kind }, el("b", { textContent: title }), el("span", { textContent: detail }));
    if (address) v.append(el("small", { textContent: address + (r.neighborhood ? " · " + r.neighborhood : "") }));
    v.append(el("span", { className: "mono", textContent: `${r.point.lat.toFixed(5)}, ${r.point.lng.toFixed(5)}` }));
    box.append(v);
  }

  document.addEventListener("keydown", (e) => {
    // Una edición abierta solo se cierra con Cancelar: así no se pierde sin querer.
    if (e.key === "Escape" && mode !== "idle" && mode !== "editing") resetAll();
  });
})();
</script>
</body>
</html>
