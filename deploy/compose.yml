# Stack del servidor (staging y prod). Lo descarga deploy.sh desde GitHub, al
# mismo commit que las imágenes, y lo ejecuta con el .env que vive en el
# servidor. No se usa en local: para eso está docker-compose.yml en la raíz.
name: dispatch

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    environment:
      PORTAL_HOST: ${PORTAL_HOST:?falta PORTAL_HOST en .env}
      BOT_HOST: ${BOT_HOST:?falta BOT_HOST en .env}
      ACME_EMAIL: ${ACME_EMAIL:?falta ACME_EMAIL en .env}
    volumes:
      - ./caddy:/etc/caddy:ro
      - caddy_data:/data # certificados: si se pierde, se piden de nuevo
      - caddy_config:/config
    depends_on:
      bot: { condition: service_healthy }
      portal: { condition: service_healthy }
    mem_limit: 128m

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: dispatch
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?falta POSTGRES_PASSWORD en .env}
      POSTGRES_DB: dispatch
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dispatch -d dispatch"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 1g

  # Solo corre al desplegar (profile "tools"): deploy.sh lo ejecuta ANTES de
  # cambiar las apps, y si falla no se toca nada.
  migrate:
    image: ${REGISTRY:?falta REGISTRY en .env}/dispatch-migrate:${IMAGE_TAG:?}
    profiles: [tools]
    environment:
      DATABASE_URL: postgres://dispatch:${POSTGRES_PASSWORD}@postgres:5432/dispatch
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  bot:
    image: ${REGISTRY}/dispatch-bot:${IMAGE_TAG:?}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://dispatch:${POSTGRES_PASSWORD}@postgres:5432/dispatch
      PORT: 3001
      INTERNAL_SECRET: ${INTERNAL_SECRET:?falta INTERNAL_SECRET en .env}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET:-}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      BOT_ACTIVE: ${BOT_ACTIVE:-false}
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/api/health"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 15s
    mem_limit: 512m

  portal:
    image: ${REGISTRY}/dispatch-portal:${IMAGE_TAG:?}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://dispatch:${POSTGRES_PASSWORD}@postgres:5432/dispatch
      PORT: 3002
      INTERNAL_SECRET: ${INTERNAL_SECRET}
      SESSION_SECRET: ${SESSION_SECRET:?falta SESSION_SECRET en .env}
      BOT_URL: http://bot:3001
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3002/login"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 15s
    mem_limit: 512m

  worker:
    image: ${REGISTRY}/dispatch-worker:${IMAGE_TAG:?}
    restart: unless-stopped
    environment:
      BOT_URL: http://bot:3001
      INTERNAL_SECRET: ${INTERNAL_SECRET}
    depends_on:
      bot: { condition: service_healthy }
    mem_limit: 128m

volumes:
  pgdata:
  caddy_data:
  caddy_config:
