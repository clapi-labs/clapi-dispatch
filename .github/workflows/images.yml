name: Imágenes

# Construye y publica las imágenes en GHCR al hacer push a dev (staging) o a
# main. Cada imagen lleva el hash del commit como etiqueta (nunca se despliega
# "latest").
on:
  push:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:
  publish:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: bot, target: runtime, app: bot }
          - { name: portal, target: runtime, app: portal }
          - { name: migrate, target: migrate, app: bot }
          - { name: worker, target: worker, app: bot }
          # Python, con su propio Dockerfile y contexto.
          - { name: engine, context: apps/engine }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context || '.' }}
          target: ${{ matrix.target }}
          build-args: |
            APP=${{ matrix.app }}
            NEXT_PUBLIC_CLIENT_NAME=${{ vars.CLIENT_NAME }}
            NEXT_PUBLIC_CLIENT_INITIALS=${{ vars.CLIENT_INITIALS }}
            NEXT_PUBLIC_CLIENT_COLOR=${{ vars.CLIENT_COLOR }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/dispatch-${{ matrix.name }}:${{ github.sha }}
            ${{ env.REGISTRY }}/dispatch-${{ matrix.name }}:${{ github.ref_name }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
