name: Imágenes

# Construye y publica las imágenes en GHCR al hacer push a dev (staging) o a
# main. Cada imagen lleva el hash del commit como etiqueta (nunca se despliega
# "latest"). En dev, cuando todas quedan publicadas, se despliega ese hash a
# staging (deploy-staging.yml). En main no se despliega nada.
on:
  push:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:
  publish:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: bot, target: runtime, app: bot }
          - { name: portal, target: runtime, app: portal }
          - { name: migrate, target: migrate, app: bot }
          - { name: worker, target: worker, app: bot }
          # Python, con su propio Dockerfile y contexto.
          - { name: engine, context: apps/engine }
          # OSRM con el mapa de Cali ya procesado. La caché evita bajar y
          # procesar el mapa en cada push: solo se rehace si cambia su Dockerfile.
          - { name: osrm, context: apps/osrm }
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context || '.' }}
          target: ${{ matrix.target }}
          build-args: |
            APP=${{ matrix.app }}
            NEXT_PUBLIC_CLIENT_NAME=${{ vars.CLIENT_NAME }}
            NEXT_PUBLIC_CLIENT_INITIALS=${{ vars.CLIENT_INITIALS }}
            NEXT_PUBLIC_CLIENT_COLOR=${{ vars.CLIENT_COLOR }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/dispatch-${{ matrix.name }}:${{ github.sha }}
            ${{ env.REGISTRY }}/dispatch-${{ matrix.name }}:${{ github.ref_name }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  # Solo si las seis imágenes se publicaron. Va como job de este workflow (y no
  # como workflow_run) porque un push a dev usa el archivo de dev, mientras que
  # workflow_run solo se dispara con el archivo de la rama principal.
  staging:
    name: Staging
    needs: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    uses: ./.github/workflows/deploy-staging.yml
    with:
      sha: ${{ github.sha }}
    secrets: inherit
