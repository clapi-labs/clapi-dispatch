name: CI

on:
  pull_request:
  push:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, tipos y build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # No necesita secretos: las variables se leen al usarlas, no al compilar.
      - run: npm run build

  migrations:
    name: Migraciones
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: dispatch
          POSTGRES_PASSWORD: dispatch
          POSTGRES_DB: dispatch
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dispatch -d dispatch"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgres://dispatch:dispatch@localhost:5432/dispatch
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Aplicar migraciones sobre una base vacía
        run: npm run db:migrate
      - name: Aplicarlas otra vez (deben ser idempotentes)
        run: npm run db:migrate
      - name: El esquema no tiene cambios sin migración
        run: |
          npm run db:generate --workspace=@dispatch/shared
          if [ -n "$(git status --porcelain packages/shared/drizzle)" ]; then
            echo "::error::schema.ts tiene cambios sin migración. Corre 'npm run db:generate' y commitea el resultado."
            git status --short packages/shared/drizzle
            exit 1
          fi
      - name: Datos de demo
        run: npm run db:seed:demo

  images:
    name: Imagen ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: bot, target: runtime, app: bot }
          - { name: portal, target: runtime, app: portal }
          - { name: worker, target: worker, app: bot }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # Solo comprueba que la imagen construye; las que se publican salen de
      # images.yml al hacer merge a main.
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          build-args: APP=${{ matrix.app }}
          push: false
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
