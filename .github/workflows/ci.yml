name: CI

# En los PRs hacia dev o main, y en main. Un push directo a dev no espera al
# CI. Las imágenes se construyen al hacer merge (images.yml).
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, tipos, pruebas y build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # No necesita secretos: las variables se leen al usarlas, no al compilar.
      - run: npm run build

  secrets:
    name: Secretos (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          # Todo el historial: un secreto en un commit viejo sigue siendo público.
          fetch-depth: 0
      # Imagen oficial con versión fija. --redact: los registros de CI de un
      # repositorio público también son públicos, así que nunca se imprime el
      # valor encontrado. safe.directory: el repositorio montado es de otro
      # usuario que el del contenedor. Reglas y excepciones: .gitleaks.toml.
      - name: Buscar llaves y contraseñas en el historial
        run: |
          docker run --rm -v "$PWD:/repo:ro" \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0='*' \
            ghcr.io/gitleaks/gitleaks:v8.21.2 \
            git /repo --config /repo/.gitleaks.toml --redact --no-banner --verbose \
            --log-opts="--all"

  engine:
    name: Engine (casos y contrato)
    # Fijo, no ubuntu-latest: en Ubuntu 26.04 setup-python aún no tiene la
    # 3.14.4 y el job falla antes de probar nada.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14.4" # igual que apps/engine/Dockerfile
      # Sin red ni Google: Haversine y librería estándar.
      - run: python -m unittest discover -s tests -v
        working-directory: apps/engine

  migrations:
    name: Migraciones
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: dispatch
          POSTGRES_PASSWORD: dispatch
          POSTGRES_DB: dispatch
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dispatch -d dispatch"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgres://dispatch:dispatch@localhost:5432/dispatch
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Aplicar migraciones sobre una base vacía
        run: npm run db:migrate
      - name: Aplicarlas otra vez (deben ser idempotentes)
        run: npm run db:migrate
      - name: El esquema no tiene cambios sin migración
        run: |
          npm run db:generate --workspace=@dispatch/shared
          if [ -n "$(git status --porcelain packages/shared/drizzle)" ]; then
            echo "::error::schema.ts tiene cambios sin migración. Corre 'npm run db:generate' y commitea el resultado."
            git status --short packages/shared/drizzle
            exit 1
          fi
      - name: Datos de demo
        run: npm run db:seed:demo
